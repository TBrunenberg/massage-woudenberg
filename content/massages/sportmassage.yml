teksten:
- Een sportmassage verbetert direct de conditie van je spieren en geeft ontspanning aan spieren die vermoeid, gespannen of overbelast zijn.
- Sportmassage is niet alleen voor topsporters. Ook recreatieve sporters en mensen met klachten door stress of een verkeerde werkhouding hebben er baat bij, denk aan rug-, nek- of schouderklachten door veel computerwerk. Door de massage worden verkrampte spieren losgemaakt en klachten verlicht.
let_op: Bij ernstige blessures verwijst Jaïrus je door naar een (sport)arts of fysiotherapeut.
voordelen:
- Betere doorbloeding en stofwisseling
- Snellere afvoer van afvalstoffen en vocht
- Ontspanning en betere spierspanning
- Helpt blessures voorkomen
- Sneller herstel na inspanning
- Betere (sport)prestaties
slotzin: Een sportmassage houdt je lichaam in vorm, ook tijdens een trainingsstop of vakantie.
