teksten:
- Een hotstone-massage combineert warmte en massage voor een diepe ontspanning. Je lichaam wordt behandeld met warme basaltstenen van ongeveer 45 graden.
- De stenen worden op knelpunten geplaatst om de warmte gericht in te zetten. Andere delen van je lichaam worden met etherische olie gemasseerd. Er wordt afgewisseld met rustige, cirkelvormige strijkingen met de stenen, waarna het deel waar de stenen lagen wordt gemasseerd. Door de warmte komt de massage dieper in het spierweefsel.
let_op: Bij een buitentemperatuur vanaf 25 graden wordt de hotstone-massage automatisch omgezet naar een ontspanningsmassage.
voordelen:
- Betere bloedcirculatie en stofwisseling
- Afvoer van afvalstoffen
- Lichamelijke en geestelijke ontspanning
- Positieve werking op chronische spierpijn
- Preventief voor een gezond lichaam
slotzin: Gun jezelf de herstellende kracht van warmte.
