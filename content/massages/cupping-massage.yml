intro: Krachtige strijkbewegingen gecombineerd met bewegende cups voor dieper gelegen weefsel.
labels:
- Cups
- Rug, nek & schouders
teksten:
- Een cuppingmassage combineert krachtige strijkbewegingen met de werking van cups. Door de vacuümwerking van de cups wordt het dieper gelegen weefsel intens gestimuleerd.
- De cups staan niet stil, maar worden zacht over de huid bewogen. Dat stimuleert het bindweefsel en de doorbloeding. De massage is uitermate geschikt bij spierspanning en bij rug-, nek- en schouderklachten.
let_op: Tijdens de massage kleurt de huid rood. Dat komt door de intense doorbloeding van het weefsel.
voordelen:
- Stimuleert het immuunsysteem
- Verbetert de doorbloeding en huidfunctie
- Verlicht rug-, nek- en schouderklachten
- Helpt spierspanning los te maken
- Bevordert herstel en ontspanning
slotzin: Geschikt voor iedereen die op zoek is naar verlichting van klachten en diepe ontspanning.
