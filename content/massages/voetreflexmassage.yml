teksten:
- Op je voeten bevinden zich reflexzones die in verbinding staan met je hele lichaam. Door deze zones te masseren worden de energiestromen gestimuleerd en blokkades opgeheven.
- Voetreflexmassage ondersteunt het zelfherstellend vermogen van je lichaam en brengt lichaam en geest in balans.
let_op: ''
voordelen:
- Herstelt de balans tussen lichaam en geest
- Stimuleert de energiedoorstroming
- Verbetert bloedcirculatie en stofwisseling
- Bevordert de afvoer van afvalstoffen
- Ondersteunt het herstelproces
- Zorgt voor diepe ontspanning
slotzin: Een fijne manier om je lichaam te laten herstellen en tot rust te laten komen.
