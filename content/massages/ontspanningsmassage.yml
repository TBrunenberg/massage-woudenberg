- Snellere afvoer van afvalstoffen
- Versterking van het immuunsysteem
- Minder stress en spanning
- Diepe lichamelijke en geestelijke ontspanning
- Preventieve werking voor een gezond lichaam
slotzin: Gun jezelf dit moment en voel hoe lichaam en geest tot rust komen.
