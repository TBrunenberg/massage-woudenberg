teksten:
- Tijdens een ontspanningsmassage wordt je lichaam met zorg en zachte bewegingen gemasseerd met natuurlijke oliën. Je spieren en bindweefsel voelen daarna soepel en ontspannen aan.
- De zachte wrijving van de olie verwarmt je huid, activeert de bloedcirculatie en bevordert het herstel van spieren en weefsels. Een moment van verwennerij voor lichaam en geest.
